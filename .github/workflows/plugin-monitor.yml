name: Monitor upstream plugins

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: plugin-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: monitor
        name: Check upstream releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-upstream-plugin-releases.sh

      - name: Record observed upstream versions
        if: steps.monitor.outputs.initialized == 'true' || steps.monitor.outputs.updates == 'true'
        run: |
          git config user.name "rightform-plugin-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/plugin-monitor-state.json
          git commit -m "Record upstream plugin versions" || exit 0
          git push

      - name: Notify about a new upstream release
        if: steps.monitor.outputs.updates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream plugin updates detected"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file .github/plugin-monitor-report.md
          else
            gh issue create --title "$title" --body-file .github/plugin-monitor-report.md
          fi
